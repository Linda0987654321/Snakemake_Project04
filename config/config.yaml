# Folder scanned directly for matching <pair>_u1.pdb and <pair>_u2.pdb files.
# u1 = receptor, u2 = ligand. Pair IDs: letters, digits, underscores, hyphens.
# Relative paths resolve from the project root; absolute paths also work.
# Use data/example to run the supplied examples, or another folder of your choice.
input_dir: "data/input"

# Shared sampling settings for every pair. Positive integers are required.
# Low values below are intended for a short demonstration.
# Details: https://lightdock.org/tutorials/basics
docking_params:
  swarms: 10       # Starting search groups around the receptor.
  glowworms: 20    # Candidate poses within each swarm.
  steps: 20        # Optimization iterations.
