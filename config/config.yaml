# Folder containing PDB partners directly inside it (no nested subfolders).
# Relative paths are resolved from the project root. Keep inputs outside work/.
input_dir: "data/raw"

# Automatically detected: <pair>_u1.pdb (receptor) + <pair>_u2.pdb (ligand).
# Add/remove complete pairs in input_dir to choose the jobs; no pair list needed.
# Pair IDs may use letters, digits, underscores and hyphens, without spaces.
# A missing partner or an empty folder stops the workflow with an explanation.

# Positive integers shared by all detected pairs.
# Small teaching-demo settings; larger sampling may be needed scientifically.
docking_params:
  swarms: 10       # Search groups distributed around the receptor.
  glowworms: 20    # Candidate poses in each swarm.
  steps: 20        # Optimization iterations.
